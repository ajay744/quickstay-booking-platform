<div class="signup-container">
    <mat-card class="signup-card">
      <h2 class="signup-title">Create an Account</h2>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full Name</mat-label>
        <input matInput placeholder="John Doe" [(ngModel)]="signupData.name" />
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" placeholder="john@example.com" [(ngModel)]="signupData.email" />
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phone</mat-label>
        <input matInput type="tel" placeholder="1234567890" [(ngModel)]="signupData.phone" />
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="signupData.password" />
      </mat-form-field>
  
      <button mat-raised-button color="primary" class="signup-button" (click)="signup()">
        Sign Up
      </button>
  
      <div class="login-redirect">
        <span>Already have an account?</span>
        <a (click)="goToLogin()">Login</a>
      </div>
    </mat-card>
  </div>
