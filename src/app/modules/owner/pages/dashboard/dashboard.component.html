<div class="dashboard-container">
    <h2>Welcome, Owner </h2>
  
    <!-- Stats Cards -->
    <div class="stats-grid">
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">apartment</mat-icon>
        <div>
          <h3>Total Properties</h3>
          <p>12</p>
        </div>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">event</mat-icon>
        <div>
          <h3>Bookings</h3>
          <p>34</p>
        </div>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">payments</mat-icon>
        <div>
          <h3>Payments</h3>
          <p>₹25,000</p>
        </div>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">rate_review</mat-icon>
        <div>
          <h3>Reviews</h3>
          <p>9</p>
        </div>
      </mat-card>
    </div>
  
    <!-- Recent Bookings Table -->
    <mat-card class="section-card">
      <mat-card-title>Recent Bookings</mat-card-title>
      <div class="table-wrapper">
        <table mat-table [dataSource]="recentBookings" class="mat-elevation-z1">
  
          <!-- Property Name -->
          <ng-container matColumnDef="property">
            <th mat-header-cell *matHeaderCellDef> Property </th>
            <td mat-cell *matCellDef="let booking"> {{ booking.property }} </td>
          </ng-container>
  
          <!-- Date -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let booking"> {{ booking.date }} </td>
          </ng-container>
  
          <!-- Amount -->
          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef> Amount </th>
            <td mat-cell *matCellDef="let booking"> ₹{{ booking.amount }} </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card>
  
    <!-- Notifications -->
    <mat-card class="section-card">
      <mat-card-title>Notifications</mat-card-title>
      <mat-list>
        <mat-list-item *ngFor="let note of notifications">
          <mat-icon matListIcon color="accent">notifications</mat-icon>
          <p matLine>{{ note.message }}</p>
          <p matLine class="secondary">{{ note.time }}</p>
        </mat-list-item>
      </mat-list>
    </mat-card>
  </div>
