<div class="dashboard-container">
    <h2>Admin Dashboard</h2>
  
    <div class="stats-grid">
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">home</mat-icon>
        <div class="stat-content">
          <h3>Total Properties</h3>
          <p>120</p>
        </div>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">assignment</mat-icon>
        <div class="stat-content">
          <h3>Bookings</h3>
          <p>87</p>
        </div>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">people</mat-icon>
        <div class="stat-content">
          <h3>Users</h3>
          <p>345</p>
        </div>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-icon class="stat-icon">payments</mat-icon>
        <div class="stat-content">
          <h3>Revenue</h3>
          <p>₹1,20,000</p>
        </div>
      </mat-card>
    </div>
  
    <div class="recent-activity">
      <h3>Recent Bookings</h3>
    
      <mat-card class="bookings-card">
        <mat-list>
          <mat-list-item *ngFor="let booking of recentBookings" class="booking-item">
            <mat-icon matListIcon color="primary">event</mat-icon>
            <div class="booking-details">
              <span class="user-name">{{ booking.user }}</span>
              <span class="property-name">booked <strong>{{ booking.property }}</strong></span>
            </div>
            <span class="booking-date">{{ booking.date }}</span>
          </mat-list-item>
        </mat-list>
      </mat-card>
    </div>
    
  </div>
